[project]
name = "aiws-cli"
version = "0.3.1"
description = "aiws — bootstrap an AI-agent workspace (skills + knowledge) for Claude Code, GitHub Copilot, or OpenAI Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agents", "skills", "knowledge", "workspace", "copilot", "claude", "codex"]
authors = [{ name = "William Theo" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
aiws = "aiws_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Force-include the bundled assets even though they are generated/untracked.
artifacts = ["src/aiws_cli/bundle/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiws_cli"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2", "twine>=5.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# scaffold.py embeds long Markdown template literals (document content).
"src/aiws_cli/scaffold.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

